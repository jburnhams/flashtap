# The learner records' database declaration (strata_python.db), inside the package so an installed wheel has it:
# `Project.load(__file__)` finds this file from learners/db.py, and pyproject.toml's [tool.strata-db] points here for
# strata-db and the pytest plugin. Paths are relative to this file.
app = "flashtap"
models = "flashtap.learners.models:Base"
migrations = "migrations"
