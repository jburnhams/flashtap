# Content dimensions (spec §4-§6). Presentation, response, scaffolding and time are properties of a mechanic, and
# arrive with the mechanics (plan PR 3).

[[dimensions]]
id = "number_range"
title = "Number range"
kind = "range"
low = 0
high = 1000
description = "The smallest and largest number the skill is practised with."

[[dimensions]]
id = "arrangement"
title = "Arrangement"
kind = "set"
values = ["line", "scattered", "dice", "ten_frame", "fingers"]
description = "How a set of things is laid out."

[[dimensions]]
id = "representation"
title = "Representation"
kind = "set"
values = ["objects", "dots", "fingers", "numerals", "spoken"]
description = "What stands for the number."

[[dimensions]]
id = "exposure"
title = "Exposure"
kind = "ordered"
values = ["untimed", "brief"]
description = "Untimed, or shown briefly so it cannot be counted (subitising). Time is never the only evidence."

[[dimensions]]
id = "letter_case"
title = "Letter case"
kind = "set"
values = ["lower", "upper"]

[[dimensions]]
id = "gpc_phase"
title = "Phonics phase"
kind = "ordered"
values = ["phase2", "phase3", "phase4", "phase5"]
description = "Which phase's correspondences are in play, in the learner's phonics sequence."

[[dimensions]]
id = "word_shape"
title = "Word shape"
kind = "ordered"
values = ["vc", "cvc", "ccvc", "cvcc", "polysyllabic"]
description = "Consonant and vowel pattern of the words, easiest first."

[[dimensions]]
id = "sound_position"
title = "Sound position"
kind = "ordered"
values = ["initial", "final", "medial"]
