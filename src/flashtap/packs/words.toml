# Words and pictures the rounds use (was src/flashtap/lexicon.py's tables), with their sounds.
#
# segments: the spelling split into graphemes, each one GPC from the phonics inventory ("oo:uː" where a grapheme has
#   two sounds). Only words whose every grapheme is in the inventory are segmented; they are the decodable words.
# onset: the first grapheme alone, for words with a GPC outside the inventory (horse ends in "se").
# neither: the first sound is outside the inventory too (aeroplane), so the word is left out of sound rounds.
# plural / article: written down where "+s" or "a" would be wrong ("sheep", "some grapes", "an elephant" is automatic).
# Phonetic segmentations were drafted, not checked by a phonics teacher: the pack stays "draft" until they are.

